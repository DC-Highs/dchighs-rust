[package]
name = "dc-client-state"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Access and manage Dragon City Windows client state (UserDefault.xml and local cached assets)."
readme = "README.md"
keywords = ["dragon-city", "dchighs", "client", "state", "windows"]
